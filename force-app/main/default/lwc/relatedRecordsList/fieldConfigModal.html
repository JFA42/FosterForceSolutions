<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Configure Fields</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={error}>
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <h2>{error}</h2>
                    </div>
                </template>
                <template if:true={isLoading}>
                    <div class="slds-is-relative">
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </div>
                </template>
                <template if:false={isLoading}>
                    <lightning-dual-listbox
                        name="fields"
                        label="Select Fields to Display"
                        source-label="Available Fields"
                        selected-label="Selected Fields"
                        options={availableFields}
                        value={selectedFields}
                        onchange={handleFieldSelection}
                        max={maxFields}>
                    </lightning-dual-listbox>
                </template>
            </div>
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleCancel}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSave}>Save</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
