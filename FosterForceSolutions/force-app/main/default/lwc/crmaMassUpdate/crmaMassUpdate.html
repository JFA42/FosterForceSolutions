<template>
    <lightning-card title="CRMA Query & Mass Update">
        <div class="slds-p-around_medium">
            <lightning-input label="Enter CRMA Query" value={crmaQuery} onchange={handleQueryChange}></lightning-input>
            <lightning-button label="Execute Query" onclick={handleExecuteQuery} class="slds-m-top_medium"></lightning-button>

            <template if:true={records}>
                <lightning-datatable
                    key-field="Id"
                    data={records}
                    columns={columns}
                    onrowaction={handleRowAction}>
                </lightning-datatable>

                <lightning-combobox
                    label="Select Field to Update"
                    value={fieldToUpdate}
                    options={availableFields}
                    onchange={handleFieldSelectionChange}
                    class="slds-m-top_medium">
                </lightning-combobox>

                <lightning-input
                    label="Enter New Value"
                    value={newFieldValue}
                    onchange={handleNewValueChange}
                    class="slds-m-top_medium">
                </lightning-input>

                <lightning-button label="Mass Update" onclick={handleMassUpdate} class="slds-m-top_medium"></lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
