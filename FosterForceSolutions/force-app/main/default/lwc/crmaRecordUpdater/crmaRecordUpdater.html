<template>
    <lightning-card title="CRMA Record Updater" icon-name="custom:custom63">
        <div class="slds-m-around_medium">
            <lightning-combobox
                name="fieldSelector"
                label="Select Fields to Display"
                multiple
                options={fieldOptions}
                value={selectedFields}
                onchange={handleFieldSelection}>
            </lightning-combobox>

            <template if:true={dynamicColumns.length}>
                <lightning-datatable
                    key-field="Id"
                    data={filteredRecords}
                    columns={dynamicColumns}
                    draft-values={draftValues}
                    onsave={handleSave}
                    oncellchange={handleCellChange}
                    hide-checkbox-column>
                </lightning-datatable>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Save Changes"
                        onclick={handleSave}
                        variant="brand"
                        disabled={disableSave}>
                    </lightning-button>
                </div>
            </template>

            <template if:false={dynamicColumns.length}>
                <p>Please select at least one field to display the data.</p>
            </template>
        </div>
    </lightning-card>
</template>
